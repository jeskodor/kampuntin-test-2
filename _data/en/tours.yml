faq:
  title: Frequently asked questions
  items:
    - q: Do I need to be very fit?
      a: >-
        Normal fitness is enough. We walk on muddy trails with climbs and river crossings. If you
        have any limitations, let us know and we will find alternatives.
    - q: Is there electricity, phone signal and internet?
      a: >-
        A solar panel powers the kitchen. Phone signal and internet are limited or non-existent —
        a good chance to disconnect.
    - q: Which languages are spoken?
      a: >-
        The community speaks Shuar Chicham and Spanish. [State whether the Kampuntin team
        accompanies groups in English or other languages.]
    - q: When is the best time to travel?
      a: >-
        The rainforest is humid all year round. [Add recommended months and the rainy season.]
    - q: Is it safe?
      a: >-
        We travel in small groups, always accompanied by community members who know the forest.
        [Describe first-aid kit, emergency communication and evacuation plan.]
