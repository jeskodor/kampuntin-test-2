intro:
  title: Travel slowly, truly live together
  image: ""
  image_alt: Visitors and community families cooking together
  text: |-
    For ten days you live in Maikiuants, about two and a half hours from the nearest
    amenities. We sleep in a traditional jea, bathe in the river and eat together. The days
    combine forest walks, work in the nursery and gardens, crafts, cooking and free time.

    Groups are small — **twelve people at most** — so that encounters stay personal and the
    community can welcome you without changing its way of life.

itinerary:
  title: What your tour could look like
  note: This programme is a guide. Weather, the river and community life set the pace.
  days:
    - title: Arrival
      text: Meet in [meeting town], travel about 2.5 hours to Maikiuants and get welcomed by the community.
    - title: Getting to know the community
      text: A walk through Maikiuants, the school and the family gardens (aja). In the afternoon, your first river bath.
    - title: The healing forest
      text: Forest walk with a Shuar guide. Medicinal plants, useful trees and how to read animal tracks.
    - title: Hands in the soil
      text: Morning in the plant nursery and agroforestry plots. Free afternoon to rest or play with the children.
    - title: Clay and fibres
      text: Pottery with the women of the community and crafts made from forest materials.
    - title: Excursion
      text: Full-day trip to [waterfall / viewpoint], with a leaf-wrapped lunch in the middle of the forest.
    - title: Science in the forest
      text: With the para-ecologists, we check camera traps and learn how wildlife is monitored.
    - title: Shuar cooking
      text: We prepare traditional dishes such as ayampaco and cassava chicha. Music in the evening.
    - title: Minga
      text: Communal work together with the families, followed by a farewell celebration with music and songs.
    - title: Departure
      text: Last breakfast together, goodbyes and the journey back to [meeting town].

