faq:
  title: Frequently asked questions
  items:
    - q: How long can I stay?
      a: >-
        The minimum stay is [2 weeks]. Longer stays are very welcome, up to [X months].
    - q: How much does volunteering cost?
      a: >-
        We ask for a contribution of [XX USD per week] for food. Accommodation in the jea is in
        exchange for your work.
    - q: Do I need experience in farming or construction?
      a: >-
        No. What matters is the willingness to learn and to work. We'll teach you everything
        you need on site.
    - q: Do I need to speak Spanish?
      a: >-
        Basic Spanish helps a lot when living with the community. [State whether someone on the
        team speaks English.]
    - q: What does a typical day look like?
      a: >-
        In the morning, when it's cooler, we work in the nursery, the plots or on construction.
        After a shared lunch, afternoons are usually free: river, walks, crafts or time with the
        children.
    - q: Is there internet and electricity?
      a: >-
        A solar panel powers the kitchen. Phone signal and internet are limited: [state where
        the nearest signal is].
    - q: Which vaccinations and insurance do I need?
      a: >-
        Travel insurance with medical cover is required. Talk to a travel doctor; for the Amazon,
        the yellow fever vaccination is usually recommended.
    - q: Can I come with my partner or friends?
      a: >-
        Yes, just write to us early. We can host [X] volunteers at the same time.
