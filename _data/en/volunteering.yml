# Volunteering page – English (based on the WWOOF profile)
# Text in [square brackets] is a placeholder: replace with the real information.

hero:
  eyebrow: Volunteering · Agroforestry · Community life
  title: Volunteering in Maikiuants
  lead: >-
    We're looking for people who like to live together and in places far from the city. To come
    here, you have to be able to get out of your comfort zone. In return, living in an
    Indigenous community in the Amazon is a great learning experience.
  image: ""
  image_alt: Volunteers planting trees in an agroforestry plot

who:
  title: Who are we looking for?
  intro: We're two and a half hours from the nearest amenities. You'll feel at home here if you…
  items:
    - enjoy being proactive and taking the initiative,
    - like working in the field, rain or shine,
    - want to learn about plants, agroforestry and permaculture,
    - enjoy living in a group and sharing tasks,
    - are open-minded, respectful and flexible.

tasks:
  title: How you'll help
  intro: We are mainly looking for people to support these tasks.
  items:
    - icon: 🌱
      title: Plant nursery
      text: "Taking care of the nursery: preparing seeds, transplanting seedlings and watering."
    - icon: 🌳
      title: Planting
      text: Planting trees and crops on the community's plots.
    - icon: 🍌
      title: Agroforestry
      text: Maintaining the agroforestry crops by weeding, pruning and harvesting.
    - icon: 🔨
      title: Construction
      text: Helping with construction work and infrastructure improvements.

life:
  title: Life in the jea
  text: |-
    We sleep in a traditional house called a **jea**, in the middle of the jungle. There are
    bunk beds on three levels and the possibility of hanging a hammock. The shower is the best
    in the world: a pure river with fresh water.

    A well-equipped kitchen is available for cooking. A solar panel supplies it with
    electricity, and there is a blender and a juice extractor. In the future, we plan to install
    a small fridge for food storage. Meals are usually shared with the other volunteers.
  # 6 photos showing how you'll live here (add a path, e.g. /assets/img/fotos/jea.jpg)
  photos:
    - { image: "", alt: The traditional jea in the middle of the rainforest }
    - { image: "", alt: Three-level bunk beds and hammocks inside the jea }
    - { image: "", alt: The river where we bathe every day }
    - { image: "", alt: The solar-powered kitchen }
    - { image: "", alt: A shared meal with the volunteers }
    - { image: "", alt: The plant nursery next to the house }

free_time:
  title: Free time
  text: >-
    In your free time, you can make the most of the area: we can take you on beautiful walks,
    you can play with the children, take part in pottery-making with the women, make crafts,
    play music and sing.
  quote: It's a place of creativity and freedom where anything is possible.

