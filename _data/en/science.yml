# Science page (para-ecology) – English

hero:
  eyebrow: Community science
  title: "Para-ecology: researching the forest from within the community"
  lead: >-
    In Maikiuants, community members train as para-ecologists. They combine Shuar knowledge
    of the forest with scientific methods to document biodiversity and protect their
    territory.
  image: ""
  image_alt: Para-ecologist checking a camera trap in the forest

what:
  title: What is a para-ecologist?
  image: ""
  image_alt: Para-ecologist writing observations in a field notebook
  text: |-
    A para-ecologist is a community member trained in ecological monitoring methods. They have
    known the forest since childhood — the tracks, the calls, the plants — and learn to record
    these observations systematically, so they can be compared over the years and shared with
    researchers.

    This way, knowledge stays in the community, and the data help to make decisions about the
    territory: where to hunt less, which areas to protect, how the river is changing.

methods:
  title: What we monitor
  intro: Simple methods, applied consistently, that anyone in the community can learn.
  items:
    - icon: 📷
      title: Camera traps
      text: Automatic cameras on trails and at salt licks record large, elusive mammals such as jaguars and tapirs.
    - icon: 🥾
      title: Fixed transects
      text: Regular walks along defined routes to record tracks, droppings, calls and sightings.
    - icon: 🐸
      title: Birds and amphibians
      text: Dawn call counts and night searches for frogs, sensitive indicators of forest health.
    - icon: 💧
      title: Water quality
      text: "Simple measurements in rivers and streams: temperature, turbidity and aquatic macroinvertebrates."
    - icon: 🌳
      title: Trees and nursery
      text: Recording seed trees, flowering and fruiting, linked to the plant nursery and agroforestry.
    - icon: 📖
      title: Shuar knowledge
      text: Shuar Chicham names, uses and stories about plants and animals, documented only with the consent of those who share them.

animals:
  title: Our animal neighbours
  intro: >-
    The forest and rivers of Maikiuants are home to countless animals. Some are threatened,
    some are new to science, and many live hidden under water.

  threatened:
    title: Threatened species
    intro: >-
      Some of the species recorded or expected in the area are threatened worldwide. Their
      presence shows the value of this forest and our responsibility to protect it.
    note: >-
      Categories according to the IUCN Red List. Example list: to be replaced with the actual
      monitoring records.
    sensitive: To protect them, we never publish exact locations of sensitive species.

