# Página de voluntariado – español (basada en el perfil de WWOOF)
# Los datos entre [corchetes] son marcadores: reemplazar por la información real.

hero:
  eyebrow: Voluntariado · Agroforestería · Vida comunitaria
  title: Voluntariado en Maikiuants
  lead: >-
    Buscamos personas a las que les guste convivir y vivir lejos de la ciudad. Para venir hay
    que estar dispuesto a salir de la zona de confort. A cambio, vivir en una comunidad indígena
    de la Amazonía es una enorme experiencia de aprendizaje.
  image: ""
  image_alt: Voluntarias plantando árboles en una parcela agroforestal

who:
  title: ¿A quién buscamos?
  intro: Estamos a dos horas y media de los servicios más cercanos. Te sentirás bien aquí si…
  items:
    - te gusta ser proactivo/a y tomar la iniciativa,
    - disfrutas trabajar en el campo, con sol y con lluvia,
    - quieres aprender sobre plantas, agroforestería y permacultura,
    - te gusta vivir en grupo y compartir las tareas,
    - eres una persona abierta, respetuosa y flexible.

tasks:
  title: En qué ayudas
  intro: Buscamos sobre todo personas que apoyen en estas tareas.
  items:
    - icon: 🌱
      title: Vivero
      text: "Cuidar el vivero: preparar semillas, trasplantar plántulas y regar."
    - icon: 🌳
      title: Siembra
      text: Plantar árboles y cultivos en las parcelas de la comunidad.
    - icon: 🍌
      title: Agroforestería
      text: Mantener los cultivos agroforestales con deshierbe, poda y cosecha.
    - icon: 🔨
      title: Construcción
      text: Apoyar en trabajos de construcción y en mejoras de la infraestructura.

life:
  title: La vida en la jea
  text: |-
    Dormimos en una casa tradicional llamada **jea**, en medio de la selva. Hay literas de tres
    niveles y la posibilidad de colgar una hamaca. La ducha es la mejor del mundo: un río puro
    de agua fresca.

    Hay una cocina bien equipada. Un panel solar le da electricidad, y hay licuadora y extractor
    de jugos. En el futuro queremos instalar una pequeña refrigeradora para guardar alimentos.
    Normalmente las comidas se comparten con los demás voluntarios.
  # 6 Fotos, die zeigen, wie man hier lebt (Pfad eintragen, z. B. /assets/img/fotos/jea.jpg)
  photos:
    - { image: "", alt: La jea tradicional en medio de la selva }
    - { image: "", alt: Literas de tres niveles y hamacas dentro de la jea }
    - { image: "", alt: El río donde nos bañamos cada día }
    - { image: "", alt: La cocina con energía solar }
    - { image: "", alt: Comida compartida con los voluntarios }
    - { image: "", alt: El vivero junto a la casa }

free_time:
  title: Tiempo libre
  text: >-
    En tu tiempo libre puedes aprovechar la zona: te llevamos a caminatas preciosas, puedes jugar
    con los niños, participar en la elaboración de cerámica con las mujeres, hacer artesanías,
    tocar música y cantar.
  quote: Es un lugar de creatividad y libertad donde todo es posible.

practical:
  title: Datos prácticos
  items:
    - { label: Estancia mínima, value: "[2 semanas]" }
    - { label: Horario de trabajo, value: "[5 horas al día, 5 días por semana]" }
    - { label: Aporte para comida, value: "[XX USD por semana]" }
    - { label: Idiomas, value: "Español (básico ayuda mucho), shuar chicham" }
    - { label: Llegada, value: "[Ciudad de encuentro], luego 2,5 h hasta la comunidad" }
  wwoof: También nos encuentras en WWOOF

apply:
  title: Cómo postular
  steps:
    - title: Preséntate
      text: Escríbenos quién eres, qué te motiva y en qué fechas te gustaría venir.
    - title: Videollamada
      text: Hablamos un rato para conocernos y aclarar expectativas.
    - title: Confirmación
      text: Acordamos las fechas y te enviamos una guía de preparación.
    - title: ¡Bienvenida/o!
      text: Te recogemos en [ciudad de encuentro] y viajamos juntos a Maikiuants.
  button: Quiero ser voluntario/a

# PLATZHALTER – echte Erfahrungsberichte (mit Einverständnis) eintragen
testimonials:
  title: Experiencias de voluntarios
  intro: Lo que cuentan quienes ya vivieron un tiempo en Maikiuants.
  # quote = kurzes Zitat (immer sichtbar) · text = ganzer Bericht zum Aufklappen (optional, beliebig lang)
  items:
    - quote: >-
        Llegué para ayudar en el vivero y me fui habiendo aprendido muchísimo más: sobre plantas,
        sobre la comunidad y sobre mí misma. Bañarse en el río cada mañana no tiene precio.
      name: "[Nombre]"
      meta: "Voluntaria · [país] · [año]"
      photo: ""
      text: |-
        Vine por tres semanas y me quedé dos meses. Al principio todo era nuevo: dormir en la jea,
        cocinar para todos, entender el ritmo de la comunidad. Poco a poco el vivero se volvió mi
        lugar favorito.

        [Aquí puede ir el relato completo: cómo fue la llegada, qué aprendiste, un momento que no
        olvidarás y qué le dirías a alguien que piensa venir.]
    - quote: >-
        Las primeras noches en la jea fueron raras, después ya no quería irme. Lo mejor fueron
        las tardes con los niños y las caminatas al atardecer.
      name: "[Nombre]"
      meta: "Voluntario · [país] · [año]"
      photo: ""
      text: |-
        [Relato completo del voluntario: cómo fueron los primeros días, la vida con las familias,
        las caminatas por el bosque y lo que se llevó de Maikiuants.]
    - quote: >-
        Es trabajo de verdad, con barro y lluvia. Pero ver crecer los árboles que plantamos y
        compartir la comida con todos hace que valga la pena.
      name: "[Nombre]"
      meta: "Voluntaria · [país] · [año]"
      photo: ""
      text: |-
        [Relato completo de la voluntaria: el trabajo en las parcelas agroforestales, la minga,
        la convivencia con los demás voluntarios y lo que significó para ella.]

faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tiempo puedo quedarme?
      a: >-
        La estancia mínima es de [2 semanas]. Estancias más largas son muy bienvenidas, hasta
        [X meses].
    - q: ¿Cuánto cuesta el voluntariado?
      a: >-
        Pedimos un aporte de [XX USD por semana] para la comida. El alojamiento en la jea es a
        cambio de tu trabajo.
    - q: ¿Necesito experiencia en agricultura o construcción?
      a: >-
        No. Lo importante son las ganas de aprender y de trabajar. Te enseñamos todo lo
        necesario en el lugar.
    - q: ¿Necesito hablar español?
      a: >-
        Un nivel básico ayuda mucho para convivir con la comunidad. [Indicar si alguien del
        equipo habla inglés.]
    - q: ¿Cómo es un día normal?
      a: >-
        Por la mañana, cuando hace más fresco, trabajamos en el vivero, en las parcelas o en
        la construcción. Después del almuerzo compartido, la tarde suele ser libre: río,
        caminatas, artesanía o tiempo con los niños.
    - q: ¿Hay internet y electricidad?
      a: >-
        Un panel solar da electricidad a la cocina. La señal de teléfono e internet es limitada:
        [indicar dónde hay señal más cercana].
    - q: ¿Qué vacunas y seguro necesito?
      a: >-
        Un seguro de viaje con cobertura médica es obligatorio. Consulta a un médico de viajes;
        para la Amazonía normalmente se recomienda la vacuna contra la fiebre amarilla.
    - q: ¿Puedo venir con mi pareja o con amigos?
      a: >-
        Sí, escríbenos con tiempo. Podemos recibir a [X] voluntarios al mismo tiempo.
