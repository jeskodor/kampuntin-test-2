  river:
    title: "Vida bajo el agua: los animales de nuestros ríos"
    text: >-
      En los ríos y quebradas viven pequeños animales acuáticos —larvas de insectos, caracoles,
      cangrejos y camarones— que casi nadie ve. Los paraecólogos los recolectan, los identifican y
      los fotografían. Como reaccionan rápido a la contaminación, nos dicen mucho sobre la salud
      del agua.
