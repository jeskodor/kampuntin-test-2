hero:
  eyebrow: Amazonía ecuatoriana · Morona Santiago
  title: Kampuntin Maikiuants
  lead: >-
    Vivir la selva junto a la comunidad shuar de Maikiuants: en tours de diez días, como
    voluntaria o voluntario, o acompañando el trabajo científico de la comunidad.
  image: ""            # p. ej. /assets/img/fotos/inicio.jpg
  image_alt: Vista sobre la selva alrededor de Maikiuants
  buttons:
    - { ref: tours, label: Conocer los tours }
    - { ref: volunteering, label: Ser voluntario/a, style: ghost }

about:
  title: Tres nombres, una historia
  items:
    - title: Los shuar
      image: ""
      image_alt: Familia shuar frente a una jea tradicional
      text: >-
        Los shuar son uno de los pueblos indígenas más numerosos de la Amazonía. Su idioma es
        el **shuar chicham**. Su vida está profundamente ligada al bosque, a los ríos y a la
        huerta familiar (*aja*): de ella vienen alimentos, medicinas, materiales y saberes que
        se transmiten de generación en generación.
    - title: Maikiuants
      image: ""
      image_alt: La comunidad de Maikiuants rodeada de selva
      text: >-
        Maikiuants es una comunidad shuar de la provincia de Morona Santiago, en la Amazonía sur
        del Ecuador, y forma parte del **Pueblo Shuar Arutam**. Rodeada de selva y ríos de agua
        limpia, la comunidad combina la vida tradicional con proyectos propios de vivero,
        agroforestería y protección de su territorio.
    - title: Kampuntin
      image: ""
      image_alt: Equipo de Kampuntin con un grupo de visitantes
      text: >-
        Kampuntin es la organización que hace posibles los tours y el voluntariado en Maikiuants.
        Organizamos el viaje, acompañamos a los grupos y cuidamos que los ingresos lleguen a la
        comunidad y a sus proyectos. Qué se comparte, cuándo y cómo, lo decide la comunidad.

explore:
  title: Descubre Maikiuants
  intro: Elige por dónde empezar.
  items:
    - ref: tours
      icon: 🛶
      title: Tours
      text: Diez días en la selva para grupos de hasta 12 personas, compartiendo la vida de la comunidad.
    - ref: volunteering
      icon: 🌱
      title: Voluntariado
      text: Vivero, agroforestería y construcción, viviendo en una jea tradicional en medio del bosque.
    - ref: science
      icon: 🔬
      title: Ciencia
      text: Paraecólogas y paraecólogos de la comunidad monitorean la biodiversidad y las especies protegidas.
    - ref: updates
      icon: 📣
      title: Novedades
      text: Noticias, fotos y pequeñas historias, publicadas directamente desde la selva.
    - ref: gallery
      icon: 📷
      title: Galería
      text: Fotos y videos de tours pasados, del voluntariado y del bosque.
    - ref: people
      icon: 🤝
      title: Equipo
      text: Las personas de Maikiuants y de Kampuntin que hacen posible todo esto.

# PLATZHALTER – die Mission wird noch genauer ausformuliert
mission:
  title: La misión de Kampuntin
  intro: >-
    Kampuntin es la organización comunitaria de turismo de Maikiuants. Recibimos visitantes
    porque queremos proteger lo que tenemos y compartirlo.
  items:
    - title: Proteger la selva
      text: Cuidamos el bosque y los ríos de nuestro territorio y mostramos que la selva vale más en pie.
    - title: Compartir la cultura shuar
      text: Transmitimos nuestra lengua, nuestros saberes y costumbres a quienes nos visitan y a las nuevas generaciones.
    - title: Aprender juntos
      text: Visitantes, voluntarios y comunidad aprendemos unos de otros, de las plantas, de la ciencia y de otras formas de vivir.
    - title: Fortalecer la comunidad
      text: Los ingresos del turismo se quedan en Maikiuants y financian proyectos propios.

quote:
  text: Es un lugar de creatividad y libertad donde todo es posible.
  source: Comunidad de Maikiuants

location:
  title: Dónde estamos
  text: >-
    Maikiuants se encuentra en la provincia de **Morona Santiago**, en la Amazonía sur del
    Ecuador. Desde Quito o Cuenca se viaja en bus hasta [ciudad más cercana] y de allí unas dos
    horas y media hasta la comunidad. Te enviamos las indicaciones exactas cuando confirmes tu viaje.
  coords: 3°07'10.2" S · 78°15'56.4" O
  map_link: Ver en OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"
  labels:
