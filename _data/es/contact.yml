faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tardan en responder?
      a: >-
        Normalmente pocos días. En la selva la señal es limitada, así que a veces tardamos un poco
        más. Por WhatsApp suele ser más rápido.
    - q: ¿En qué idiomas puedo escribir?
      a: En español o en inglés. [Indicar otros idiomas si los hay.]
    - q: ¿Cómo llego a Maikiuants?
      a: >-
        Desde Quito o Cuenca en bus hasta [ciudad más cercana] y de allí unas dos horas y media
        hasta la comunidad. Para tours y voluntariado organizamos el último tramo contigo.
    - q: ¿Puedo visitar Maikiuants sin hacer un tour?
      a: >-
        Las visitas se acuerdan siempre antes con la comunidad. Escríbenos y vemos qué es
        posible.
    - q: ¿Puedo cambiar o cancelar una reserva?
      a: "[Indicar las condiciones de cambio y cancelación.]"
    - q: ¿Cómo puedo apoyar sin viajar?
      a: >-
        Compartiendo nuestras novedades, comprando nuestro libro o ayudando con traducción,
        fotografía o redes sociales. [Indicar si hay una forma de donar.]
