faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Necesito una buena condición física?
      a: >-
        Basta una condición física normal. Caminamos por senderos con barro, subidas y cruces de
        río. Si tienes alguna limitación, avísanos y buscamos alternativas.
    - q: ¿Hay electricidad, señal de teléfono e internet?
      a: >-
        Un panel solar abastece la cocina. La señal de teléfono e internet es limitada o
        inexistente: una buena oportunidad para desconectarse.
    - q: ¿Qué idiomas se hablan?
      a: >-
        En la comunidad se habla shuar chicham y español. [Indicar si el equipo de Kampuntin
        acompaña en inglés u otros idiomas.]
    - q: ¿Cuál es la mejor época para viajar?
      a: >-
        La selva es húmeda todo el año. [Indicar los meses recomendados y la temporada de
        lluvias.]
    - q: ¿Es seguro?
      a: >-
        Viajamos en grupos pequeños y siempre acompañados por personas de la comunidad que
        conocen el bosque. [Describir botiquín, comunicación de emergencia y plan de evacuación.]
