# =============================================================
#  Maikiuants · Kampuntin – Website-Einstellungen
#  Nach Änderungen an dieser Datei baut GitHub Pages die Seite neu
#  (dauert ca. 1–2 Minuten).
# =============================================================

title: "Kampuntin Maikiuants"
description: "Tours, voluntariado y ciencia comunitaria con la comunidad shuar de Maikiuants, Amazonía ecuatoriana."

# Adresse der Website. GitHub Pages setzt url/baseurl automatisch.
# Nur ausfüllen, wenn eine eigene Domain genutzt wird, z. B.:
# url: "https://www.kampuntin.org"
# baseurl: ""

# Bild für Vorschauen in WhatsApp/Facebook (1200×630 px empfohlen)
og_image: ""            # z. B. /assets/img/og.jpg

# --- Kontakt (TODO: echte Daten eintragen) -------------------
contact:
  email: "info@kampuntin.example"
  whatsapp: "593000000000"         # internationale Nummer ohne + und Leerzeichen
  phone_display: "+593 00 000 0000"
  # Optional: Formular-Dienst, damit das Kontaktformular E-Mails verschickt.
  # Kostenlos z. B. bei https://formspree.io (50 Nachrichten/Monat).
  # Leer lassen = Formular öffnet das E-Mail-Programm der Besucher.
  form_endpoint: ""                # z. B. "https://formspree.io/f/abcdwxyz"

# --- Soziale Netzwerke (leer lassen = wird nicht angezeigt) --
social:
  instagram: "https://www.instagram.com/"   # TODO: eigenes Profil
  facebook:                                 # eine oder mehrere Facebook-Seiten
    - name: Kampuntin
      url: "https://www.facebook.com/profile.php?id=61576137841827"
    - name: Maikiuants
      url: "https://www.facebook.com/profile.php?id=61566774571229"
  wwoof: ""                                 # Link zum WWOOF-Profil

# Zeigt auf „Novedades“ die Facebook-Chroniken (erst nach Klick, wegen Datenschutz)
facebook_timeline: true

# =============================================================
#  Ab hier: technische Einstellungen – normalerweise nicht ändern
# =============================================================
lang: es
timezone: America/Guayaquil
permalink: /novedades/:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: es
      ref: updates

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .pages.yml
  - node_modules
